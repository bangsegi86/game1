<title>포탄대결 탱크 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 라인업 격자 → 선택한 탱크의 큰 무대 + 상태 6칸 → 포탄 3칸. 해질녘 전장 색 위에 호박색 포인트. */
:root {
  --sky: #1f2d52;
  --panel: #283a66;
  --panel-2: #324779;
  --line: #45598e;
  --ink: #f4efe1;
  --muted: #aab5d3;
  --amber: #ffb703;
  --amber-ink: #3a2600;
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; display: grid; gap: 36px; }
canvas { display: block; width: 100%; height: auto; max-width: 100%; }
.eyebrow { font-size: 12px; letter-spacing: .1em; color: var(--amber); font-weight: 700; }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
header h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.05; margin-top: 6px; }
section > h2 { font-size: 26px; margin-bottom: 4px; }
section > .lead { margin-bottom: 14px; }

.lineup { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 0 0 12px; overflow: hidden; text-align: left; display: grid; gap: 2px; }
.card[aria-pressed="true"] { border-color: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 30%, transparent); }
.card canvas { aspect-ratio: 280 / 180; }
.card .name { font-family: var(--font-display); font-size: 20px; padding: 0 12px; display: flex; align-items: baseline; gap: 8px; }
.card .role { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--amber); }
.card .concept { font-size: 12.5px; color: var(--muted); padding: 0 12px; }

.detail { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stage canvas { aspect-ratio: 720 / 380; }
.states { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; border-top: 1px solid var(--line); }
.states button { border: 1px solid var(--line); background: var(--sky); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.states button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.info { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.info h3 { font-size: 34px; line-height: 1; }
.info .role { color: var(--amber); font-weight: 700; font-size: 13px; }
.info p { margin: 0; color: var(--muted); }
.info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-variant-numeric: tabular-nums; }
.info dt { color: var(--muted); }
.info dd { margin: 0; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches span { width: 34px; height: 34px; border-radius: 8px; border: 2px solid #241d2e; }
.notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }

.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; }
.cell canvas { aspect-ratio: 240 / 180; }
.cell .t { padding: 8px 10px 10px; display: grid; gap: 2px; }
.cell b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.cell small { color: var(--muted); font-size: 12px; line-height: 1.4; }

.shells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.shell { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; }
.shell canvas { aspect-ratio: 340 / 190; }
.shell .t { padding: 10px 14px 14px; display: grid; gap: 2px; }
.shell .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.shell b { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.shell .slot { font-size: 11px; font-weight: 700; color: var(--amber); letter-spacing: .06em; }
.shell .dmg { font-variant-numeric: tabular-nums; font-weight: 700; }
.shell small { color: var(--muted); font-size: 13px; }

@media (max-width: 980px) {
  .lineup { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .detail { grid-template-columns: minmax(0, 1fr); }
  .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .shells { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card .concept { display: none; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">포탄대결 · 아트 시안 v2</div>
    <h1>탱크 도감</h1>
    <p class="lead">탱크 8종의 생김새, 상태별 모습, 탱크마다 다른 포탄 3종입니다. 모두 움직이는 그림이고, 실제 게임에서도 같은 그림을 씁니다. 탱크를 누르면 아래에서 자세히 볼 수 있어요.</p>
  </header>

  <section>
    <h2>라인업</h2>
    <p class="lead">실루엣만 봐도 구분되도록 탱크마다 머리 위 모양을 다르게 했습니다.</p>
    <div class="lineup" id="lineup"></div>
  </section>

  <section>
    <div class="detail">
      <div class="stage">
        <canvas id="stage" width="720" height="380" aria-label="선택한 탱크 큰 그림"></canvas>
        <div class="states" id="stateBtns" role="group" aria-label="상태 선택"></div>
      </div>
      <div class="info" id="info"></div>
    </div>
  </section>

  <section>
    <h2>상태별 모습</h2>
    <p class="lead">게임 중 탱크는 이 6가지 모습 사이를 오갑니다. 표정과 연기, 흔들림으로 상태가 한눈에 보이게 했습니다.</p>
    <div class="strip" id="strip"></div>
  </section>

  <section>
    <h2 id="shellTitle">포탄</h2>
    <p class="lead">주무기 1, 주무기 2, 필살기(SS). 포탄마다 모양, 꼬리 효과, 폭발 모양이 다릅니다.</p>
    <div class="shells" id="shells"></div>
  </section>
</div>

<script src="art.js"></script>
<script>
function renderShell(c, w, h, T, sh, t, idx) {
  const gy = h - 30; scene(c, w, h, gy);
  const cyc = 3, tc = (t + idx * .37) % cyc;
  renderTank(c, w, h, T, tc < .25 ? 'fire' : 'idle', tc < .25 ? tc : t, 46, gy, .48);
  const sx = 70, sy = gy - 46, ex = w - 70, ey = gy - 2;
  const n = sh.count || 1;
  if (sh.path === 'sky') {
    if (tc < .9) { const k = (tc * 4) % 1 < .5; c.strokeStyle = k ? '#ff4d4d' : 'rgba(255,77,77,.4)'; c.lineWidth = 2.5; circ(c, ex, ey, 14); c.stroke(); c.beginPath(); c.moveTo(ex - 20, ey); c.lineTo(ex + 20, ey); c.moveTo(ex, ey - 20); c.lineTo(ex, ey + 6); c.stroke(); }
    else if (tc < 1.5) { const p = (tc - .9) / .6, bw = 6 + 20 * Math.sin(Math.min(1, p) * Math.PI);
      const g = c.createLinearGradient(ex - bw, 0, ex + bw, 0); g.addColorStop(0, 'rgba(47,224,255,0)'); g.addColorStop(.3, 'rgba(47,224,255,.9)'); g.addColorStop(.5, '#ffffff'); g.addColorStop(.7, 'rgba(47,224,255,.9)'); g.addColorStop(1, 'rgba(47,224,255,0)');
      c.fillStyle = g; c.fillRect(ex - bw, 0, bw * 2, ey); }
    if (tc >= 1.2 && tc < 2) boom(c, sh, ex, ey, (tc - 1.2) / .8);
  } else if (sh.path === 'straight') {
    const fl = .35;
    if (tc < fl + .25) { const p = Math.min(1, tc / fl), x2 = sx + (ex - sx) * p, y2 = sy + (ey - sy) * p, a = tc > fl ? 1 - (tc - fl) / .25 : 1;
      c.save(); c.lineCap = 'round'; c.strokeStyle = `rgba(47,224,255,${.6 * a})`; c.lineWidth = 12; c.beginPath(); c.moveTo(sx, sy); c.lineTo(x2, y2); c.stroke();
      c.strokeStyle = `rgba(255,255,255,${a})`; c.lineWidth = 4; c.stroke(); c.restore(); }
    if (tc >= fl && tc < fl + .8) boom(c, sh, ex, ey, (tc - fl) / .8);
  } else {
    const fl = 1.25;
    for (let k = 0; k < n; k++) {
      const off = k - (n - 1) / 2, exk = ex + off * (n > 3 ? 18 : 24), hh = 78 + off * 8;
      const pos = u => [sx + (exk - sx) * u, sy + (ey - sy) * u - 4 * hh * u * (1 - u)];
      if (tc < fl) {
        const u = tc / fl, pts = []; for (let j = 1; j <= 12; j++) { const uu = u - j * .028; if (uu > 0) pts.push(pos(uu)); }
        trail(c, sh, pts, t);
        const [x, y] = pos(u), ang = Math.atan2((ey - sy) - 4 * hh * (1 - 2 * u), exk - sx);
        c.save(); c.translate(x, y); c.scale(1.25, 1.25); drawShell(c, sh, t, ang); c.restore();
      } else if (tc < fl + .8) boom(c, sh, exk, ey, (tc - fl) / .8);
    }
  }
  if (sh.path !== 'straight' && sh.path !== 'sky' || true) {
    c.save(); c.translate(w - 40, 38); circ(c, 0, 0, 27); c.fillStyle = 'rgba(31,45,82,.82)'; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.25)'; c.stroke();
    c.save(); c.beginPath(); c.arc(0, 0, 27, 0, TAU); c.clip(); c.scale(1.35, 1.35);
    if (sh.key === 'beam') { c.lineCap = 'round'; c.strokeStyle = 'rgba(47,224,255,.7)'; c.lineWidth = 9; c.beginPath(); c.moveTo(-16, 8); c.lineTo(16, -8); c.stroke(); c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); }
    else if (sh.key === 'sky') { const g = c.createLinearGradient(-8, 0, 8, 0); g.addColorStop(0, 'rgba(47,224,255,0)'); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, 'rgba(47,224,255,0)'); c.fillStyle = g; c.fillRect(-9, -22, 18, 44); c.fillStyle = 'rgba(47,224,255,.5)'; c.fillRect(-12, -22, 24, 44); }
    else drawShell(c, sh, t, -.5);
    c.restore(); c.restore();
  }
}

/* ---------- 페이지 ---------- */
let sel = 0, selState = 'fire';
const views = [];
function addView(canvas, w, h, draw) {
  canvas.width = Math.round(w * DPR); canvas.height = Math.round(h * DPR);
  const v = { canvas, ctx: canvas.getContext('2d'), w, h, draw, visible: true }; views.push(v); io && io.observe(canvas); return v;
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { const v = views.find(v => v.canvas === e.target); if (v) v.visible = e.isIntersecting; })) : null;

const lineup = document.getElementById('lineup');
TANKS.forEach((T, i) => {
  const b = document.createElement('button'); b.className = 'card'; b.setAttribute('aria-pressed', i === sel);
  b.innerHTML = `<canvas aria-label="${T.name}"></canvas><div class="name">${T.name}<span class="role">${T.role}</span></div><div class="concept">${T.concept}</div>`;
  lineup.append(b);
  addView(b.querySelector('canvas'), 280, 180, (c, w, h, t) => { scene(c, w, h, h - 32); renderTank(c, w, h, T, 'idle', t, w / 2, h - 32, 1.1); });
  b.onclick = () => { sel = i; document.querySelectorAll('.card').forEach((x, k) => x.setAttribute('aria-pressed', k === sel)); renderDetail(); document.getElementById('stage').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' }); };
});

addView(document.getElementById('stage'), 720, 380, (c, w, h, t) => {
  scene(c, w, h, h - 58); renderTank(c, w, h, TANKS[sel], selState, t, w / 2 - 10, h - 58, 2.5);
  c.font = '15px Jua, sans-serif'; c.fillStyle = 'rgba(58,38,0,.7)'; c.textAlign = 'left'; c.fillText(STATES.find(s => s.id === selState).n + ' 상태', 18, 30);
});
const sb = document.getElementById('stateBtns');
STATES.forEach(s => { const b = document.createElement('button'); b.textContent = s.n; b.dataset.s = s.id; b.onclick = () => { selState = s.id; syncStateBtns(); }; sb.append(b); });
function syncStateBtns() { sb.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === selState)); }

const strip = document.getElementById('strip');
STATES.forEach(s => {
  const d = document.createElement('div'); d.className = 'cell';
  d.innerHTML = `<canvas aria-label="${s.n}"></canvas><div class="t"><b>${s.n}</b><small>${s.d}</small></div>`;
  strip.append(d);
  addView(d.querySelector('canvas'), 240, 180, (c, w, h, t) => { scene(c, w, h, h - 30); renderTank(c, w, h, TANKS[sel], s.id, t, w / 2, h - 30, 1.05); });
});

const shellsEl = document.getElementById('shells');
['주무기 1', '주무기 2', '필살기 SS'].forEach((slot, k) => {
  const d = document.createElement('div'); d.className = 'shell';
  d.innerHTML = `<canvas></canvas><div class="t"><div class="top"><b data-n></b><span class="slot">${slot}</span></div><span class="dmg" data-d></span><small data-desc></small></div>`;
  shellsEl.append(d);
  addView(d.querySelector('canvas'), 340, 190, (c, w, h, t) => renderShell(c, w, h, TANKS[sel], SHELLS[TANKS[sel].id][k], t, k));
});

function renderDetail() {
  const T = TANKS[sel];
  document.getElementById('info').innerHTML = `
    <div><div class="role">${T.role}</div><h3>${T.name}</h3></div>
    <p>${T.concept}</p>
    <dl><dt>체력</dt><dd>${T.hp}</dd><dt>각도</dt><dd>${T.ang}</dd>
    ${SHELLS[T.id].map((s, k) => `<dt>${['주무기 1', '주무기 2', '필살기'][k]}</dt><dd>${s.n} · ${s.d}</dd>`).join('')}</dl>
    <div><div class="role" style="margin-bottom:6px">색상</div><div class="swatches">${T.swatch.map(c => `<span style="background:${c}" title="${c}"></span>`).join('')}</div></div>
    <ul class="notes">${T.notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
  document.getElementById('shellTitle').textContent = `${T.name}의 포탄`;
  shellsEl.querySelectorAll('.shell').forEach((d, k) => { const s = SHELLS[T.id][k]; d.querySelector('[data-n]').textContent = s.n; d.querySelector('[data-d]').textContent = '피해 ' + s.d; d.querySelector('[data-desc]').textContent = s.desc; });
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0 = performance.now();
function frame(now) {
  const t = reduce ? 1.2 : (now - t0) / 1000;
  views.forEach(v => { if (!v.visible) return; const c = v.ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, v.w, v.h); v.draw(c, v.w, v.h, t); });
  if (!reduce) requestAnimationFrame(frame);
}
renderDetail(); syncStateBtns();
requestAnimationFrame(frame);
if (reduce) [200, 800].forEach(ms => setTimeout(() => requestAnimationFrame(frame), ms));
</script>
